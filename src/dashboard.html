<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LexVault Pro - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden text-slate-800">

    <!-- Menú Lateral (Sidebar) -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col">
        <div class="h-16 flex items-center px-6 border-b border-slate-800">
            <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
            <span class="text-lg font-bold">LexVault Pro</span>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="#" class="flex items-center px-4 py-2 bg-slate-800 rounded-md text-sm font-medium">
                Expedientes Activos
            </a>
            <a href="#" class="flex items-center px-4 py-2 text-slate-400 hover:bg-slate-800 hover:text-white rounded-md text-sm font-medium transition-colors">
                Auditoría / Historial
            </a>
        </nav>
        <div class="p-4 border-t border-slate-800 text-sm">
            <p id="displayUserName" class="font-bold">Usuario</p>
            <p id="displayUserRole" class="text-slate-400 text-xs">Rol</p>
            <button id="logoutBtn" class="mt-3 text-red-400 hover:text-red-300 text-xs flex items-center">
                Cerrar Sesión
            </button>
        </div>
    </aside>

    <!-- Contenido Principal -->
    <main class="flex-1 flex flex-col h-screen overflow-y-auto">
        <!-- Header -->
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8">
            <h1 class="text-xl font-semibold">Gestión de Contratos y Expedientes</h1>
        </header>

        <!-- Zona de Trabajo -->
        <div class="p-8 max-w-6xl mx-auto w-full">
            
            <!-- Tarjeta de Subida de Archivos (Versionado) -->
            <div class="bg-white p-6 rounded-lg shadow-sm border border-slate-200 mb-8">
                <h2 class="text-lg font-semibold mb-4">Cargar Nuevo Documento / Actualizar Versión</h2>
                <div class="flex gap-4 items-end">
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-slate-700 mb-1">Seleccionar Archivo Legal</label>
                        <input type="file" id="fileInput" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-slate-50 file:text-slate-700 hover:file:bg-slate-100 border border-slate-200 rounded-md">
                    </div>
                    <button id="uploadBtn" class="bg-slate-800 text-white px-6 py-2 rounded-md hover:bg-slate-900 transition text-sm font-medium">
                        Subir al Repositorio
                    </button>
                </div>
                <p id="uploadMessage" class="text-green-600 text-sm mt-3 hidden">¡Archivo subido exitosamente! Nueva versión registrada.</p>
            </div>

            <!-- Tabla de Documentos -->
            <div class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
                <table class="min-w-full divide-y divide-slate-200">
                    <thead class="bg-slate-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Nombre del Documento</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Versión Actual</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Última Modificación</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-slate-500 uppercase tracking-wider">Estado</th>
                        </tr>
                    </thead>
                    <tbody id="documentTableBody" class="bg-white divide-y divide-slate-200">
                        <!-- Los documentos se insertarán aquí dinámicamente con JS -->
                    </tbody>
                </table>
            </div>

        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
