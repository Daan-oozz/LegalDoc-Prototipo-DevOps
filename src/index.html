<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor Documental Legal - Login</title>
    <!-- Tailwind CSS (CDN para despliegue rápido en prototipos) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 h-screen flex items-center justify-center">

    <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
        
        <!-- Logo / Encabezado -->
        <div class="text-center mb-8">
            <div class="bg-slate-900 text-white w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">LexVault Pro</h1>
            <p class="text-sm text-slate-500 mt-1">Gestión Documental Segura</p>
        </div>

        <!-- Formulario de Login -->
        <form id="loginForm" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-slate-700">Correo Institucional</label>
                <input type="email" id="email" class="mt-1 block w-full px-3 py-2 bg-white border border-slate-300 rounded-md text-sm shadow-sm placeholder-slate-400 focus:outline-none focus:border-slate-500 focus:ring-1 focus:ring-slate-500" placeholder="abogado@firma.com" required>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-slate-700">Contraseña</label>
                <input type="password" id="password" class="mt-1 block w-full px-3 py-2 bg-white border border-slate-300 rounded-md text-sm shadow-sm placeholder-slate-400 focus:outline-none focus:border-slate-500 focus:ring-1 focus:ring-slate-500" placeholder="••••••••" required>
            </div>

            <div class="flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember-me" type="checkbox" class="h-4 w-4 text-slate-600 focus:ring-slate-500 border-slate-300 rounded">
                    <label for="remember-me" class="ml-2 block text-sm text-slate-900">Recordarme</label>
                </div>
                <div class="text-sm">
                    <a href="#" class="font-medium text-slate-600 hover:text-slate-500">¿Olvidó su contraseña?</a>
                </div>
            </div>

            <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-slate-800 hover:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-900 transition-colors">
                Ingresar al Sistema
            </button>
            
            <!-- Mensaje de error oculto por defecto -->
            <p id="errorMessage" class="text-red-500 text-sm text-center hidden mt-2">Credenciales incorrectas. Intente de nuevo.</p>
        </form>
    </div>

    <!-- Script de lógica de autenticación -->
    <script src="js/login.js"></script>
</body>
</html>
